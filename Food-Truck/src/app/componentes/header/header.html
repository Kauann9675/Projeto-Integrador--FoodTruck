<header class="header">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center">
      <div class="logo d-flex align-items-center">
        <div class="logo-icon">🍴</div>
        <div class="logo-text ms-2">
          <h1>Street Food Truck</h1>
          <p>Sabor de rua, qualidade gourmet</p>
        </div>
      </div>
      <div class="header-buttons d-flex gap-2">
        <button type="button" class="btn btn-light" (click)="abrirPedidos()">Pedidos</button>
        <button type="button" class="cart-btn" (click)="abrirCarrinho()">
          Carrinho <span class="cart-count">{{ cartCount }}</span>
        </button>
      </div>
    </div>
  </div>
</header>
