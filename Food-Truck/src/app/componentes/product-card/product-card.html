<div class="product-card">
  <img [src]="produto.image || 'https://placehold.co/600x400?text=Produto'" [alt]="produto.name" class="product-image">
  <div class="product-content">
    <h3>{{ produto.name }}</h3>
    <p class="product-description">{{ produto.description }}</p>
    <div class="d-flex justify-content-between align-items-center gap-2">
      <span class="price">R$ {{ produto.price.toFixed(2) }}</span>
      <button type="button" class="add-btn" (click)="adicionar()">+ Adicionar</button>
    </div>
    <button type="button" class="ingredients-btn w-100 mt-2" (click)="verIngredientes()">Ver ingredientes</button>
    <div class="d-flex gap-2 mt-3">
      <button type="button" class="btn btn-outline-primary btn-sm flex-fill" (click)="editarProduto()">Editar</button>
      <button type="button" class="btn btn-outline-danger btn-sm flex-fill" (click)="excluirProduto()">Excluir</button>
    </div>
  </div>
</div>
